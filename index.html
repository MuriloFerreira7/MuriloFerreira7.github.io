<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0D1F3C">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Zaano Viaja — Clube de Crédito de Viagens</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <style>
        /* =========================================================================
   ZAANO VIAJA — DESIGN TOKENS
   ========================================================================= */
        :root {
            --navy-deep: #08152B;
            --navy: #0D1F3C;
            --navy-card: #132646;
            --navy-card-2: #1A3358;
            --navy-elev: #1E3C67;
            --gold: #C9A227;
            --gold-light: #E8C766;
            --gold-dim: #8A7226;
            --ink: #F5F3EE;
            --ink-muted: #9FB0C8;
            --ink-faint: #5E7291;
            --line: #22385C;
            --line-soft: #1A2C4A;
            --good: #4FBF8B;
            --good-bg: rgba(79, 191, 139, 0.14);
            --bad: #E08A73;
            --bad-bg: rgba(224, 138, 115, 0.14);
            --radius-lg: 20px;
            --radius-md: 14px;
            --radius-sm: 10px;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
        }

        body {
            background: radial-gradient(120% 60% at 50% 0%, #17325C 0%, var(--navy) 45%, var(--navy-deep) 100%);
            background-attachment: fixed;
            color: var(--ink);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        .display {
            font-family: 'Outfit', sans-serif;
        }

        .tabular {
            font-variant-numeric: tabular-nums;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        button {
            font-family: inherit;
        }

        ::selection {
            background: var(--gold);
            color: var(--navy-deep);
        }

        ::-webkit-scrollbar {
            width: 0;
            height: 0;
        }

        .icon {
            width: 20px;
            height: 20px;
            flex-shrink: 0;
        }

        .icon-sm {
            width: 16px;
            height: 16px;
        }

        /* =========================================================================
   APP SHELL
   ========================================================================= */
        #app-shell {
            max-width: 440px;
            margin: 0 auto;
            min-height: 100vh;
            position: relative;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 60px rgba(0, 0, 0, 0.35);
        }

        #view-root {
            flex: 1;
            padding-bottom: 18px;
        }

        #view-root.pad-tabbar {
            padding-bottom: 100px;
        }

        .fade-in {
            animation: fadeIn .38s cubic-bezier(.2, .7, .3, 1);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* =========================================================================
   TOPBAR
   ========================================================================= */
        #topbar {
            position: sticky;
            top: 0;
            z-index: 40;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 16px 18px;
            background: rgba(8, 21, 43, 0.82);
            backdrop-filter: blur(14px);
            border-bottom: 1px solid var(--line-soft);
        }

        .tb-left {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
        }

        .tb-back {
            width: 34px;
            height: 34px;
            border-radius: 10px;
            border: 1px solid var(--line);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--ink-muted);
            flex-shrink: 0;
        }

        .tb-title {
            font-family: 'Outfit';
            font-weight: 600;
            font-size: 15px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .tb-eyebrow {
            font-size: 10.5px;
            color: var(--ink-faint);
            letter-spacing: 0.05em;
        }

        .tb-right {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .tb-icon-btn {
            width: 34px;
            height: 34px;
            border-radius: 10px;
            border: 1px solid var(--line);
            background: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--ink-muted);
            position: relative;
            cursor: pointer;
        }

        .tb-icon-btn .dot {
            position: absolute;
            top: 6px;
            right: 6px;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--gold-light);
            box-shadow: 0 0 0 2px rgba(8, 21, 43, 0.9);
        }

        .tb-login-btn {
            padding: 8px 16px;
            border-radius: 999px;
            border: 1px solid var(--gold-dim);
            color: var(--gold-light);
            font-size: 12.5px;
            font-weight: 600;
            font-family: 'Outfit';
        }

        .z-mark {
            width: 34px;
            height: 34px;
            border-radius: 9px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(155deg, #2a3f63 0%, #142A4D 40%, #0A1729 100%);
            box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.18), inset 0 -4px 8px rgba(0, 0, 0, 0.45), 0 6px 14px rgba(0, 0, 0, 0.4);
        }

        .z-mark span {
            font-family: 'Outfit';
            font-weight: 800;
            font-size: 17px;
            background: linear-gradient(180deg, #F5E6B0 0%, var(--gold-light) 35%, var(--gold) 60%, var(--gold-dim) 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .z-mark-lg {
            width: 56px;
            height: 56px;
            border-radius: 14px;
        }

        .z-mark-lg span {
            font-size: 28px;
        }

        /* =========================================================================
   TYPE / SECTION HELPERS
   ========================================================================= */
        .section-label {
            font-size: 11px;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--ink-faint);
            font-weight: 700;
        }

        .section-head {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            padding: 0 20px;
            margin-bottom: 12px;
        }

        .link-sm {
            font-size: 12px;
            color: var(--gold-light);
            font-weight: 600;
        }

        .muted {
            color: var(--ink-muted);
        }

        .faint {
            color: var(--ink-faint);
        }

        /* =========================================================================
   BUTTONS
   ========================================================================= */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            border: none;
            cursor: pointer;
            font-family: 'Outfit';
            font-weight: 700;
            border-radius: 14px;
            transition: transform .12s ease, opacity .12s ease;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-primary {
            width: 100%;
            padding: 16px;
            background: linear-gradient(180deg, var(--gold-light), var(--gold));
            color: var(--navy-deep);
            font-size: 15px;
            box-shadow: 0 10px 24px rgba(201, 162, 39, 0.28);
        }

        .btn-primary-sm {
            padding: 10px 16px;
            background: linear-gradient(180deg, var(--gold-light), var(--gold));
            color: var(--navy-deep);
            font-size: 12.5px;
            border-radius: 11px;
        }

        .btn-ghost {
            width: 100%;
            padding: 14px;
            background: transparent;
            color: var(--ink);
            border: 1px solid var(--line);
            font-size: 13.5px;
        }

        .btn-ghost-sm {
            padding: 9px 14px;
            background: transparent;
            color: var(--ink-muted);
            border: 1px solid var(--line);
            font-size: 12px;
            border-radius: 11px;
        }

        .btn-danger-sm {
            padding: 9px 14px;
            background: var(--bad-bg);
            color: var(--bad);
            border: 1px solid rgba(224, 138, 115, 0.35);
            font-size: 12px;
            border-radius: 11px;
        }

        .btn-block-row {
            padding: 0 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn-row {
            display: flex;
            gap: 8px;
        }

        /* =========================================================================
   CARDS / LISTS
   ========================================================================= */
        .card {
            border: 1px solid var(--line);
            border-radius: var(--radius-md);
            background: var(--navy-card);
            padding: 16px;
        }

        .card-grad {
            background: linear-gradient(160deg, var(--navy-card) 0%, var(--navy) 100%);
        }

        .divider {
            height: 1px;
            background: var(--line-soft);
            margin: 14px 0;
        }

        .empty-state {
            text-align: center;
            padding: 40px 24px;
            color: var(--ink-faint);
            font-size: 13px;
            line-height: 1.6;
        }

        .empty-state .icon {
            width: 32px;
            height: 32px;
            margin: 0 auto 10px;
            opacity: 0.6;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-size: 10.5px;
            font-weight: 700;
            padding: 3px 9px;
            border-radius: 999px;
            letter-spacing: 0.02em;
        }

        .badge-ok {
            background: var(--good-bg);
            color: var(--good);
        }

        .badge-late {
            background: var(--bad-bg);
            color: var(--bad);
        }

        .badge-gold {
            background: rgba(201, 162, 39, 0.16);
            color: var(--gold-light);
        }

        .badge-muted {
            background: rgba(159, 176, 200, 0.1);
            color: var(--ink-muted);
        }

        .avatar {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Outfit';
            font-weight: 700;
            font-size: 14px;
            color: var(--navy-deep);
            background: linear-gradient(160deg, var(--gold-light), var(--gold-dim));
        }

        /* =========================================================================
   FORMS
   ========================================================================= */
        .field {
            margin-bottom: 14px;
        }

        .field label {
            display: block;
            font-size: 11.5px;
            font-weight: 600;
            color: var(--ink-muted);
            margin-bottom: 6px;
            letter-spacing: 0.02em;
        }

        .field input,
        .field select,
        .field textarea {
            width: 100%;
            padding: 13px 14px;
            border-radius: 12px;
            border: 1px solid var(--line);
            background: var(--navy-card-2);
            color: var(--ink);
            font-size: 14px;
            font-family: 'Inter';
            outline: none;
            transition: border-color .15s;
        }

        .field input::placeholder,
        .field textarea::placeholder {
            color: var(--ink-faint);
        }

        .field input:focus,
        .field select:focus,
        .field textarea:focus {
            border-color: var(--gold-dim);
        }

        .field textarea {
            resize: vertical;
            min-height: 80px;
        }

        .field-hint {
            font-size: 11px;
            color: var(--ink-faint);
            margin-top: 5px;
        }

        .segmented {
            display: flex;
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 3px;
            gap: 3px;
            margin-bottom: 18px;
        }

        .segmented button {
            flex: 1;
            padding: 10px 8px;
            border: none;
            background: transparent;
            color: var(--ink-faint);
            font-family: 'Outfit';
            font-weight: 600;
            font-size: 12.5px;
            border-radius: 9px;
            cursor: pointer;
        }

        .segmented button.active {
            background: var(--navy-elev);
            color: var(--gold-light);
        }

        .search-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 11px 14px;
            border-radius: 12px;
            border: 1px solid var(--line);
            background: var(--navy-card-2);
            margin: 0 20px 14px;
        }

        .search-bar input {
            flex: 1;
            border: none;
            background: transparent;
            color: var(--ink);
            font-size: 13.5px;
            outline: none;
        }

        .search-bar .icon {
            color: var(--ink-faint);
        }

        .filter-chips {
            display: flex;
            gap: 8px;
            padding: 0 20px 14px;
            overflow-x: auto;
        }

        .chip {
            padding: 7px 13px;
            border-radius: 999px;
            border: 1px solid var(--line);
            font-size: 11.5px;
            font-weight: 600;
            color: var(--ink-faint);
            white-space: nowrap;
            cursor: pointer;
        }

        .chip.active {
            border-color: var(--gold-dim);
            color: var(--gold-light);
            background: rgba(201, 162, 39, 0.1);
        }

        /* =========================================================================
   MODAL / SHEET / TOAST
   ========================================================================= */
        #modal-layer {
            position: fixed;
            inset: 0;
            z-index: 100;
            display: none;
            align-items: flex-end;
            justify-content: center;
        }

        #modal-layer.open {
            display: flex;
        }

        .modal-overlay {
            position: absolute;
            inset: 0;
            background: rgba(4, 10, 22, 0.65);
            backdrop-filter: blur(3px);
            animation: fadeIn .2s;
        }

        .modal-sheet {
            position: relative;
            width: 100%;
            max-width: 440px;
            background: var(--navy);
            border-top: 1px solid var(--line);
            border-radius: 22px 22px 0 0;
            padding: 10px 20px 26px;
            max-height: 86vh;
            overflow-y: auto;
            animation: sheetUp .28s cubic-bezier(.2, .8, .3, 1);
            box-shadow: 0 -20px 50px rgba(0, 0, 0, 0.45);
        }

        @keyframes sheetUp {
            from {
                transform: translateY(100%);
            }

            to {
                transform: translateY(0);
            }
        }

        .sheet-handle {
            width: 36px;
            height: 4px;
            border-radius: 99px;
            background: var(--line);
            margin: 6px auto 16px;
        }

        .sheet-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }

        .sheet-title {
            font-family: 'Outfit';
            font-weight: 700;
            font-size: 17px;
        }

        .sheet-close {
            width: 30px;
            height: 30px;
            border-radius: 9px;
            border: 1px solid var(--line);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--ink-muted);
            cursor: pointer;
        }

        #toast-container {
            position: fixed;
            top: 14px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 200;
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 100%;
            max-width: 400px;
            padding: 0 16px;
        }

        .toast {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 13px 16px;
            border-radius: 13px;
            background: #102544;
            border: 1px solid var(--line);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
            font-size: 13px;
            font-weight: 600;
            animation: toastIn .25s ease;
        }

        .toast.ok {
            border-color: rgba(79, 191, 139, 0.4);
        }

        .toast .icon {
            color: var(--good);
            flex-shrink: 0;
        }

        @keyframes toastIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .toast.leaving {
            animation: toastOut .25s ease forwards;
        }

        @keyframes toastOut {
            to {
                opacity: 0;
                transform: translateY(-10px);
            }
        }

        /* =========================================================================
   BOTTOM TABBAR
   ========================================================================= */
        #tabbar {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            z-index: 40;
            width: 100%;
            max-width: 440px;
            display: flex;
            justify-content: space-around;
            background: rgba(8, 17, 35, 0.92);
            backdrop-filter: blur(16px);
            border-top: 1px solid var(--line-soft);
            padding: 10px 6px calc(14px + env(safe-area-inset-bottom));
        }

        .tab {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            font-size: 10px;
            color: var(--ink-faint);
            font-weight: 600;
            flex: 1;
            position: relative;
            cursor: pointer;
        }

        .tab.on {
            color: var(--gold-light);
        }

        .tab .dot {
            position: absolute;
            top: -2px;
            right: calc(50% - 15px);
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--gold-light);
        }

        /* =========================================================================
   PUBLIC — LANDING
   ========================================================================= */
        .hero {
            padding: 30px 22px 6px;
        }

        .headline {
            font-family: 'Outfit';
            font-weight: 700;
            font-size: 29px;
            line-height: 1.2;
            margin: 16px 0 10px;
        }

        .headline em {
            font-style: normal;
            color: var(--gold-light);
        }

        .lede {
            color: var(--ink-muted);
            font-size: 14px;
            line-height: 1.6;
            margin: 0 0 22px;
        }

        .hero-actions {
            display: flex;
            gap: 10px;
        }

        .hero-actions .btn-primary {
            width: auto;
            flex: 1;
            padding: 14px;
        }

        .hero-actions .btn-ghost {
            width: auto;
            flex: 1;
            padding: 12px;
        }

        .plans-wrap {
            padding: 6px 20px 0;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .plan-card {
            border: 1px solid var(--line);
            border-radius: var(--radius-lg);
            background: linear-gradient(160deg, var(--navy-card) 0%, var(--navy) 100%);
            padding: 19px 19px 17px;
            position: relative;
            overflow: hidden;
        }

        .plan-card.feat {
            border-color: var(--gold-dim);
            box-shadow: 0 0 0 1px rgba(201, 162, 39, 0.22), 0 16px 30px rgba(0, 0, 0, 0.35);
        }

        .plan-badge {
            position: absolute;
            top: 16px;
            right: 16px;
            font-size: 9.5px;
            font-weight: 700;
            letter-spacing: 0.05em;
            color: var(--navy-deep);
            background: var(--gold-light);
            padding: 3px 9px;
            border-radius: 999px;
        }

        .plan-top {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
        }

        .plan-name {
            font-family: 'Outfit';
            font-weight: 600;
            font-size: 16.5px;
        }

        .plan-audience {
            font-size: 11px;
            color: var(--ink-faint);
        }

        .plan-price {
            font-family: 'Outfit';
            font-weight: 700;
            font-size: 23px;
            margin-top: 8px;
        }

        .plan-price small {
            font-size: 12px;
            color: var(--ink-muted);
            font-weight: 500;
        }

        .plan-bonus {
            display: flex;
            align-items: center;
            gap: 6px;
            margin: 10px 0 14px;
            font-size: 12.5px;
            color: var(--gold-light);
            font-weight: 600;
        }

        .dot-gold {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: var(--gold-light);
        }

        .plan-actions {
            display: flex;
            gap: 8px;
        }

        .plan-actions .btn-primary-sm {
            flex: 1;
        }

        .plan-actions .btn-ghost-sm {
            flex: 1;
        }

        .how-it-works {
            padding: 30px 20px 6px;
        }

        .steps {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-top: 14px;
        }

        .step {
            display: flex;
            gap: 13px;
            align-items: flex-start;
        }

        .step-num {
            width: 26px;
            height: 26px;
            border-radius: 8px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Outfit';
            font-weight: 700;
            font-size: 11.5px;
            color: var(--gold-light);
            border: 1px solid var(--gold-dim);
        }

        .step-txt {
            font-size: 13.5px;
            color: var(--ink-muted);
            line-height: 1.55;
            padding-top: 3px;
        }

        .step-txt b {
            color: var(--ink);
            font-weight: 600;
        }

        .cta-final {
            margin: 30px 20px 6px;
            padding: 22px 20px;
            border-radius: 20px;
            text-align: center;
            background: linear-gradient(160deg, #1A3358 0%, #0D1F3C 70%);
            border: 1px solid var(--line);
        }

        .cta-final .display {
            font-size: 17px;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .cta-final p {
            font-size: 12.5px;
            color: var(--ink-muted);
            margin: 0 0 16px;
        }

        .contact-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 24px 22px 4px;
            font-size: 12px;
            color: var(--ink-faint);
        }

        .contact-row a {
            color: var(--ink-muted);
            font-weight: 600;
        }

        .contact-sep {
            width: 3px;
            height: 3px;
            border-radius: 50%;
            background: var(--ink-faint);
        }

        .footer-note {
            text-align: center;
            font-size: 10.5px;
            color: var(--ink-faint);
            padding: 16px 30px 30px;
            line-height: 1.7;
        }

        /* =========================================================================
   SIGNUP / LOGIN
   ========================================================================= */
        .auth-wrap {
            padding: 24px 24px 10px;
        }

        .auth-head {
            text-align: center;

            e.preventDefault();
            const title = document.getElementById('off-title').value;
            const body = document.getElementById('off-body').value;
            const audience = document.getElementById('off-audience').value;
            let reach = SUBSCRIBERS.length;

            }
            const offer = { id: OFFERS.length + 1, title, body, audience, date: new Date().toLocaleDateString('pt-BR'), reach };

            const clientPlanName = getPlan(CLIENT.planId).name;
            if (audience === 'Todos os assinantes' || audience === 'Somente ' + clientPlanName) {
                CLIENT.notifications.unshift({ id: CLIENT.notifications.length + 1, type: 'oferta', title, body, date: offer.date, read: false });

            document.getElementById('off-title').value = '';
            document.getElementById('off-body').value = '';
            toast('Notificação enviada para ' + reach + ' assinante' + (reach === 1 ? '' : 's'));
            render();

    </div>
    <div class="btn-row">
      <a class="btn btn-ghost-sm" style="flex:1;" href="${whatsappLink('Olá ' + s.name.split(' ')[0] + ', tudo bem? Notamos que sua mensalidade do Zaano Viaja está em aberto — podemos ajudar a regularizar?')}" target="_blank">${icon('whatsapp', 15)} Lembrete</a>
      <button class="btn btn-danger-sm" style="flex:1;" onclick="markPaid(${s.id})">Marcar como pago</button>
    </div>
  </div>`;
        }
        function markPaid(id) {
            const s = getSubscriber(id);
            if (s) { s.status = 'ok'; delete s.daysLate; }
            toast('Assinante marcado como em dia');
            render();
        }

        /* =========================================================================
           INICIALIZAÇÃO
           ========================================================================= */
        if (!location.hash) { location.hash = '#/'; }
        render();
        window.addEventListener('hashchange', render);
    </script>
</body>

</html>
